<div class="min-h-screen bg-slate-50 dark:bg-black text-slate-800 dark:text-slate-100 transition-colors duration-300 font-sans flex flex-col isolate">
  <!-- Subtle dot-grid texture -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(circle,rgba(100,116,139,0.16)_1px,transparent_1px)] bg-[size:22px_22px] dark:bg-[radial-gradient(circle,rgba(255,255,255,0.06)_1px,transparent_1px)]"></div>

  <!-- Accent bar -->
  <div class="h-1 bg-slate-700"></div>

  <!-- Nav -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-slate-200/60 dark:border-white/10">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a routerLink="/" class="flex items-center gap-2.5 shrink-0" aria-label="Lumina Support — home">
        <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-slate-700 text-white shadow-md shadow-slate-900/20">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" aria-hidden="true"><path fill-rule="evenodd" d="M12 1.5a.75.75 0 0 1 .75.75v1.5H15a2.25 2.25 0 0 1 2.25 2.25v.75h1.5A3.75 3.75 0 0 1 22.5 10.5v6A3.75 3.75 0 0 1 18.75 20.25H5.25A3.75 3.75 0 0 1 1.5 16.5v-6A3.75 3.75 0 0 1 5.25 6.75h1.5V6A2.25 2.25 0 0 1 9 3.75h2.25V2.25A.75.75 0 0 1 12 1.5ZM6.75 11.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm6.75 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM9 15.75a.75.75 0 0 0 0 1.5h6a.75.75 0 0 0 0-1.5H9Z" clip-rule="evenodd" /></svg>
        </div>
        <div class="leading-tight hidden sm:block">
          <div class="font-extrabold font-display text-base tracking-tight">Lumina Support</div>
          <div class="text-[0.65rem] text-slate-400 dark:text-slate-500 -mt-0.5">Agentic customer support</div>
        </div>
      </a>

      <div class="flex items-center gap-1 sm:gap-2">
        <a
          href="#features"
          class="hidden sm:block px-3 py-2 rounded-full text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 hover:bg-slate-100 dark:hover:text-white dark:hover:bg-white/10 transition-colors"
        >Features</a>
        <a
          href="#how-it-works"
          class="hidden md:block px-3 py-2 rounded-full text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 hover:bg-slate-100 dark:hover:text-white dark:hover:bg-white/10 transition-colors"
        >How it works</a>
        <button
          (click)="toggleTheme()"
          class="ml-1 p-2 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-white/10 dark:hover:text-slate-200 transition-colors"
          [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <svg *ngIf="!isDarkMode()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" /></svg>
          <svg *ngIf="isDarkMode()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" /></svg>
        </button>
        <button
          (click)="openChat()"
          class="ml-1 px-3.5 sm:px-4 py-2 rounded-full bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold shadow-md shadow-slate-900/25 hover:shadow-lg hover:scale-[1.02] transition-all"
        >Chat now</button>
      </div>
    </nav>
  </header>

  <!-- Page content -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-100 dark:border-white/10 bg-white/60 dark:bg-black/60">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-slate-700 text-white">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4" aria-hidden="true"><path fill-rule="evenodd" d="M12 1.5a.75.75 0 0 1 .75.75v1.5H15a2.25 2.25 0 0 1 2.25 2.25v.75h1.5A3.75 3.75 0 0 1 22.5 10.5v6A3.75 3.75 0 0 1 18.75 20.25H5.25A3.75 3.75 0 0 1 1.5 16.5v-6A3.75 3.75 0 0 1 5.25 6.75h1.5V6A2.25 2.25 0 0 1 9 3.75h2.25V2.25A.75.75 0 0 1 12 1.5ZM6.75 11.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm6.75 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM9 15.75a.75.75 0 0 0 0 1.5h6a.75.75 0 0 0 0-1.5H9Z" clip-rule="evenodd" /></svg>
        </div>
        <div class="text-sm">
          <div class="font-semibold font-display">Lumina Support</div>
          <div class="text-xs text-slate-400 dark:text-slate-500">Agentic customer support platform</div>
        </div>
      </div>
      <div class="flex items-center gap-6 text-sm text-slate-500 dark:text-slate-400">
        <a href="#features" class="hover:text-slate-800 dark:hover:text-slate-100 transition-colors">Features</a>
        <a href="#how-it-works" class="hover:text-slate-800 dark:hover:text-slate-100 transition-colors">How it works</a>
        <button (click)="openChat()" class="hover:text-slate-800 dark:hover:text-slate-100 transition-colors">Chat</button>
        <span class="text-xs">© 2026 Lumina</span>
      </div>
    </div>
  </footer>

  <!-- Floating support chat (available on every page) -->
  <app-chat-widget />
</div>
