<!-- Mobile backdrop (tap to close) -->
<div *ngIf="isOpen()" class="fixed inset-0 z-40 bg-black/40 backdrop-blur-[2px] sm:hidden animate-fade-in" (click)="close()"></div>

<!-- Floating launcher button -->
<button
  (click)="isOpen() ? close() : open()"
  class="fixed bottom-4 right-4 sm:bottom-5 sm:right-5 z-50 flex items-center justify-center w-14 h-14 rounded-full bg-slate-700 hover:bg-slate-600 text-white shadow-lg shadow-slate-900/30 hover:shadow-xl hover:scale-105 transition-all"
  [attr.aria-label]="isOpen() ? 'Close chat' : 'Open chat'"
  [attr.aria-expanded]="isOpen()"
>
  <svg *ngIf="!isOpen()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M12 1.5a.75.75 0 0 1 .75.75v1.5H15a2.25 2.25 0 0 1 2.25 2.25v.75h1.5A3.75 3.75 0 0 1 22.5 10.5v6A3.75 3.75 0 0 1 18.75 20.25H5.25A3.75 3.75 0 0 1 1.5 16.5v-6A3.75 3.75 0 0 1 5.25 6.75h1.5V6A2.25 2.25 0 0 1 9 3.75h2.25V2.25A.75.75 0 0 1 12 1.5ZM6.75 11.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm6.75 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM9 15.75a.75.75 0 0 0 0 1.5h6a.75.75 0 0 0 0-1.5H9Z" clip-rule="evenodd" /></svg>
  <svg *ngIf="isOpen()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" /></svg>
  <span *ngIf="!isOpen()" class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 bg-rose-500 border-2 border-white dark:border-black rounded-full animate-pulse"></span>
</button>

<!-- Drawer -->
<div
  *ngIf="isOpen()"
  class="fixed inset-x-0 bottom-0 z-50 sm:inset-x-auto sm:bottom-24 sm:right-5 w-full sm:w-96 h-[82dvh] sm:h-[560px] sm:max-h-[calc(100dvh-8rem)] animate-chat-in"
>
  <ng-container *ngTemplateOutlet="panel" />
</div>

<ng-template #panel>
  <div
    class="bg-white dark:bg-black rounded-t-3xl sm:rounded-3xl shadow-2xl shadow-slate-900/20 dark:shadow-black/50 overflow-hidden flex flex-col h-full border border-slate-200/70 dark:border-white/10"
  >
    <!-- Login screen -->
    <div *ngIf="!customer()" class="flex-1 flex flex-col overflow-y-auto p-6">
      <div class="flex flex-col items-center text-center mb-6">
        <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-700 text-white shadow-md mb-3 animate-float"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M12 1.5a.75.75 0 0 1 .75.75v1.5H15a2.25 2.25 0 0 1 2.25 2.25v.75h1.5A3.75 3.75 0 0 1 22.5 10.5v6A3.75 3.75 0 0 1 18.75 20.25H5.25A3.75 3.75 0 0 1 1.5 16.5v-6A3.75 3.75 0 0 1 5.25 6.75h1.5V6A2.25 2.25 0 0 1 9 3.75h2.25V2.25A.75.75 0 0 1 12 1.5ZM6.75 11.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm6.75 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM9 15.75a.75.75 0 0 0 0 1.5h6a.75.75 0 0 0 0-1.5H9Z" clip-rule="evenodd" /></svg></div>
        <h3 class="text-base font-bold font-display">Support Agent Platform</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">Demo — sign in as a customer to get started. Each account only sees its own orders and tickets.</p>
      </div>

      <div class="flex flex-col gap-2.5">
        <button
          *ngFor="let account of demoAccounts()"
          (click)="login(account)"
          class="flex items-center justify-between px-4 py-3 rounded-2xl bg-slate-50 hover:bg-slate-100 dark:bg-white/[0.04] dark:hover:bg-white/10 border border-slate-200 dark:border-white/10 transition-colors text-left"
        >
          <div>
            <div class="font-semibold text-sm">{{ account.name }}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400">{{ account.email }}</div>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-slate-400"><path fill-rule="evenodd" d="M16.28 11.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06-1.06L14.69 12 7.72 5.03a.75.75 0 0 1 1.06-1.06l7.5 7.5Z" clip-rule="evenodd" /></svg>
        </button>
      </div>

      <p *ngIf="loginError()" class="mt-4 text-xs text-red-500 text-center">{{ loginError() }}</p>
      <p *ngIf="!demoAccounts().length && !loginError()" class="mt-4 text-xs text-slate-400 text-center">Loading demo accounts…</p>
    </div>

    <!-- Chat screen -->
    <ng-container *ngIf="customer()">
      <!-- Header -->
      <div class="px-4 sm:px-5 py-3.5 flex items-center justify-between border-b border-slate-100 dark:border-white/10 bg-white/80 dark:bg-black/80 backdrop-blur-sm z-10">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="relative flex items-center justify-center w-9 h-9 rounded-full bg-slate-700 text-white shadow-md shrink-0 animate-float"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12 1.5a.75.75 0 0 1 .75.75v1.5H15a2.25 2.25 0 0 1 2.25 2.25v.75h1.5A3.75 3.75 0 0 1 22.5 10.5v6A3.75 3.75 0 0 1 18.75 20.25H5.25A3.75 3.75 0 0 1 1.5 16.5v-6A3.75 3.75 0 0 1 5.25 6.75h1.5V6A2.25 2.25 0 0 1 9 3.75h2.25V2.25A.75.75 0 0 1 12 1.5ZM6.75 11.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm6.75 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM9 15.75a.75.75 0 0 0 0 1.5h6a.75.75 0 0 0 0-1.5H9Z" clip-rule="evenodd" /></svg>
            <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-400 border-2 border-white dark:border-black rounded-full"></div>
          </div>
          <div class="min-w-0">
            <h3 class="font-semibold font-display text-sm leading-tight truncate">Support Agent</h3>
            <span class="text-[0.65rem] font-medium text-emerald-500">Online</span>
          </div>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button (click)="close()" class="p-1.5 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-white/10 dark:hover:text-slate-200 transition-colors" title="Close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" /></svg>
          </button>
          <button (click)="logout()" class="px-2.5 py-1 rounded-full text-[0.65rem] font-medium text-slate-500 hover:text-slate-700 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-slate-200 dark:hover:bg-white/10 transition-colors" title="Sign out">{{ customer()!.name }}</button>
        </div>
      </div>

      <!-- Chat Feed -->
      <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 scroll-smooth bg-slate-50/50 dark:bg-black">
        <div *ngFor="let msg of messages()" class="flex flex-col max-w-[88%] sm:max-w-[85%]" [ngClass]="msg.sender === 'user' ? 'self-end items-end' : 'self-start items-start'">
          <div class="px-3.5 py-2.5 shadow-sm" [ngClass]="msg.sender === 'user' ? 'bg-slate-700 text-white rounded-2xl rounded-tr-sm' : 'bg-white dark:bg-white/[0.06] border border-slate-100 dark:border-white/10 text-slate-700 dark:text-slate-200 rounded-2xl rounded-tl-sm'">
            <p class="text-sm leading-relaxed break-words whitespace-pre-wrap">{{ msg.text }}</p>
          </div>
          <span class="text-[0.6rem] text-slate-400 mt-1.5 px-1">{{ msg.timestamp | date:'shortTime' }}</span>
        </div>

        <!-- Tool activity -->
        <div *ngIf="toolActivity()" class="self-start flex items-center gap-2 text-xs text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5 animate-spin"><path d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8V2Z" /></svg>
          <span>Calling tool: <code class="font-mono">{{ toolActivity() }}</code></span>
        </div>

        <!-- Loading Indicator -->
        <div *ngIf="isLoading() && !toolActivity()" class="flex flex-col self-start items-start max-w-[85%]">
          <div class="px-3.5 py-3 bg-white dark:bg-white/[0.06] border border-slate-100 dark:border-white/10 rounded-2xl rounded-tl-sm shadow-sm flex items-center gap-1.5">
            <div class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0s;"></div>
            <div class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.15s;"></div>
            <div class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.3s;"></div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="p-3 sm:p-3.5 bg-white dark:bg-black border-t border-slate-100 dark:border-white/10 z-10">
        <div class="flex overflow-x-auto gap-2 pb-2.5 mb-1 no-scrollbar" style="scrollbar-width: none;">
          <button *ngFor="let chip of actionChips" (click)="sendMessage(chip)" [disabled]="isLoading()" class="whitespace-nowrap px-3 py-1 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-white/[0.06] dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 text-[0.7rem] font-medium transition-colors border border-transparent dark:border-white/10 disabled:opacity-50">
            {{ chip }}
          </button>
        </div>

        <div class="flex items-center gap-2 relative">
          <input
            type="text"
            [ngModel]="newMessage()"
            (ngModelChange)="newMessage.set($event)"
            (keyup.enter)="sendMessage()"
            placeholder="Type your message..."
            [disabled]="isLoading()"
            class="flex-1 min-w-0 bg-slate-50 dark:bg-white/[0.06] border border-slate-200 dark:border-white/10 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500/50 focus:border-slate-500 transition-all text-slate-700 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500"
          />
          <button
            (click)="sendMessage()"
            [disabled]="isLoading() || !newMessage().trim()"
            class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 text-white transition-all disabled:opacity-50 disabled:hover:bg-slate-700 disabled:cursor-not-allowed shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 dark:focus:ring-offset-black shrink-0"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 ml-0.5"><path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" /></svg>
          </button>
        </div>
      </div>
    </ng-container>
  </div>
</ng-template>
