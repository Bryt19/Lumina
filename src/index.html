<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AgenticCustomerSupportAssistantPlatform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.svg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Load fonts without blocking first paint; font-display:swap handles the FOUT. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
  <app-root></app-root>
  <script>
    // Restore saved theme before Angular boots to avoid a flash of the wrong theme
    (function () {
      try {
        var stored = localStorage.getItem('lumina-theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.classList.toggle('dark', dark);
      } catch (e) {}
    })();
  </script>
</body>
</html>
